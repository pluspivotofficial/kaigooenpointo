<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>応募ダッシュボード（モック）｜オフィス別</title>
<!--
  ===========================================================================
  軽量ダッシュボード モック（叩き台）
  - 外部ライブラリ・外部フォント・画像なし。単一HTML + バニラJSのみ＝軽い。
  - 下の SAMPLE_DATA を、GAS が返す集計済みJSON（docs/dashboard-redesign.md の
    スキーマと同一）に差し替えるだけで本番化できる。
  - 本番では SAMPLE_DATA の代わりに loadFromApi() の fetch() を有効化する。
  ===========================================================================
-->
<style>
  :root{
    --navy:#1A2855; --navy-soft:#4a5578; --ink:#1f2640; --muted:#7a809c;
    --line:#e7e9f2; --bg:#f5f6fb; --card:#ffffff;
    --coral:#E85A4F; --coral-bg:#fdecea; --gold:#E8A93F;
    --green:#1f9d6b; --green-bg:#e7f6ef; --red:#d14535; --red-bg:#fdeceb;
    --blue:#3a6ea5;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    font-family: system-ui, -apple-system, "Hiragino Kaku Gothic ProN", "Noto Sans JP", "Meiryo", sans-serif;
    color:#1f2640; background:var(--bg); line-height:1.5; font-size:14px;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:20px 18px 60px}

  /* header */
  header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:14px;justify-content:space-between;margin-bottom:18px}
  .title h1{font-size:20px;color:var(--navy);letter-spacing:.02em}
  .title p{font-size:12px;color:var(--muted);margin-top:2px}
  .controls{display:flex;gap:8px;align-items:center}
  select,button{font:inherit;color:var(--ink);background:#fff;border:1px solid var(--line);border-radius:8px;padding:7px 11px;cursor:pointer}
  button.refresh{background:var(--navy);color:#fff;border-color:var(--navy)}
  .updated{font-size:11px;color:var(--muted)}

  /* KPI strip */
  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:13px 15px}
  .kpi .k-label{font-size:11px;color:var(--muted)}
  .kpi .k-val{font-size:24px;font-weight:700;color:var(--navy);font-variant-numeric:tabular-nums}
  .kpi .k-sub{font-size:11px;color:var(--muted)}

  /* tabs */
  .tabs{display:flex;gap:6px;border-bottom:1px solid var(--line);margin-bottom:14px;flex-wrap:wrap}
  .tab{padding:9px 16px;border:none;background:none;border-radius:0;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;border-radius:8px 8px 0 0}
  .tab.active{color:var(--coral);border-bottom-color:var(--coral);background:#fff}

  /* card + table */
  .panel{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
  .panel-head{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
  .panel-head h2{font-size:14px;color:var(--navy)}
  .panel-head .hint{font-size:11px;color:var(--muted)}
  .scroll{overflow-x:auto}
  table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
  th,td{padding:9px 12px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
  th.l,td.l{text-align:left}
  thead th{background:#fafbff;color:var(--navy-soft);font-size:12px;font-weight:700;position:sticky;top:0}
  tbody tr:hover{background:#fafbff}
  tbody td{font-size:13px}
  td.office{font-weight:600;color:var(--ink)}
  td.pref{font-size:11px;color:var(--muted);font-weight:400}
  tfoot td{background:#f4f5fb;font-weight:700;color:var(--navy);border-top:2px solid var(--line)}
  .group-head th{background:#eef0f8;border-bottom:1px solid var(--line);color:var(--navy);text-align:center}
  .sep{border-left:1px solid var(--line)}

  /* mini bar (達成率) */
  .bar{display:inline-flex;align-items:center;gap:7px;justify-content:flex-end;width:100%}
  .bar .track{flex:0 0 64px;height:7px;background:#eef0f6;border-radius:5px;overflow:hidden}
  .bar .fill{height:100%;border-radius:5px;background:var(--coral)}
  .bar .pct{font-size:11px;color:var(--muted);min-width:34px;text-align:right}

  .pill{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700}
  .pill.up{background:var(--green-bg);color:var(--green)}
  .pill.down{background:var(--red-bg);color:var(--red)}
  .note{font-size:11px;color:var(--muted);margin-top:10px}
  .legend{display:flex;gap:14px;flex-wrap:wrap;font-size:11px;color:var(--muted);padding:10px 16px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="title">
      <h1>応募ダッシュボード <span style="font-size:12px;color:var(--coral)">MOCK / 叩き台</span></h1>
      <p>オフィス別｜総応募・MCG・人選を突合した集計ビュー</p>
    </div>
    <div class="controls">
      <select id="monthSel">
        <option value="2026-06">2026年6月</option>
        <option value="2026-05">2026年5月</option>
      </select>
      <button class="refresh" id="refreshBtn">更新</button>
    </div>
  </header>

  <div class="kpis" id="kpis"></div>

  <div class="tabs" id="tabs">
    <button class="tab active" data-t="overview">① 応募サマリー</button>
    <button class="tab" data-t="selection">② 人選判定</button>
    <button class="tab" data-t="funnel">③ 歩留</button>
  </div>

  <div id="view"></div>
  <p class="updated" id="updated" style="margin-top:12px"></p>
</div>

<script>
/* ============================================================
   サンプルデータ（GASの集計済みJSONと同一スキーマ）
   本番では loadFromApi() に差し替え
   ============================================================ */
const SAMPLE_DATA = {
  generatedAt: "2026-06-19T06:00:00+09:00",
  month: "2026-06",
  offices: [
    { office:"新宿オフィス", prefectures:["東京都"],
      overview:{ newApplications:42, reApplications:8, targetNew:60, forecast:55, contacts:30 },
      selection:{ A:5, B:10, C:8, other:3, unknown:2 },
      funnel:{ currentMonthNew:{set:20,done:15,decided:8,started:5}, within2MonthsNew:{set:10,done:7,decided:4,started:2}, reApplication:{set:6,done:4,decided:2,started:1} } },
    { office:"横浜オフィス", prefectures:["神奈川県"],
      overview:{ newApplications:38, reApplications:5, targetNew:45, forecast:48, contacts:27 },
      selection:{ A:6, B:8, C:6, other:2, unknown:4 },
      funnel:{ currentMonthNew:{set:18,done:12,decided:7,started:4}, within2MonthsNew:{set:8,done:5,decided:3,started:2}, reApplication:{set:4,done:3,decided:1,started:1} } },
    { office:"大阪オフィス", prefectures:["大阪府","兵庫県"],
      overview:{ newApplications:51, reApplications:11, targetNew:55, forecast:63, contacts:40 },
      selection:{ A:9, B:14, C:10, other:5, unknown:3 },
      funnel:{ currentMonthNew:{set:26,done:19,decided:11,started:7}, within2MonthsNew:{set:12,done:9,decided:5,started:3}, reApplication:{set:8,done:6,decided:3,started:2} } },
    { office:"名古屋オフィス", prefectures:["愛知県"],
      overview:{ newApplications:29, reApplications:4, targetNew:40, forecast:34, contacts:19 },
      selection:{ A:3, B:7, C:5, other:1, unknown:6 },
      funnel:{ currentMonthNew:{set:13,done:8,decided:4,started:2}, within2MonthsNew:{set:6,done:4,decided:2,started:1}, reApplication:{set:3,done:2,decided:1,started:0} } },
    { office:"福岡オフィス", prefectures:["福岡県"],
      overview:{ newApplications:33, reApplications:7, targetNew:35, forecast:40, contacts:24 },
      selection:{ A:4, B:9, C:7, other:2, unknown:3 },
      funnel:{ currentMonthNew:{set:16,done:11,decided:6,started:4}, within2MonthsNew:{set:7,done:5,decided:3,started:2}, reApplication:{set:5,done:3,decided:2,started:1} } }
  ]
};

/* 本番用（GAS Web API から集計済みJSONを取得）:
async function loadFromApi(month){
  const res = await fetch(`https://script.google.com/macros/s/XXXX/exec?month=${month}`);
  return await res.json();
}
*/

let DATA = SAMPLE_DATA;
let curTab = "overview";

const $ = s => document.querySelector(s);
const num = n => (n==null ? "–" : Number(n).toLocaleString("ja-JP"));
function sum(arr, path){ return arr.reduce((a,o)=>a + path.split(".").reduce((x,k)=>x?.[k] ?? 0, o), 0); }

/* ---- KPI strip（全オフィス合算） ---- */
function renderKpis(){
  const o = DATA.offices;
  const newApp = sum(o,"overview.newApplications");
  const reApp  = sum(o,"overview.reApplications");
  const target = sum(o,"overview.targetNew");
  const fore   = sum(o,"overview.forecast");
  const contacts = sum(o,"overview.contacts");
  const rate = target ? Math.round(newApp/target*100) : 0;
  const foreDiff = fore - target;
  $("#kpis").innerHTML = [
    kpi("新規応募（合計）", num(newApp), `目標 ${num(target)}・達成 ${rate}%`),
    kpi("再応募（合計）", num(reApp), "過去データと重複"),
    kpi("着地見込み（合計）", num(fore), pill(foreDiff)+" 対目標"),
    kpi("接触数（合計）", num(contacts), "MCG 由来"),
    kpi("対象オフィス", num(o.length), DATA.month)
  ].join("");
}
const kpi = (l,v,s)=>`<div class="kpi"><div class="k-label">${l}</div><div class="k-val">${v}</div><div class="k-sub">${s}</div></div>`;
const pill = d => d>=0 ? `<span class="pill up">+${num(d)}</span>` : `<span class="pill down">${num(d)}</span>`;

/* ---- Table 1: 応募サマリー ---- */
function tableOverview(){
  const rows = DATA.offices.map(o=>{
    const v=o.overview, rate=v.targetNew?Math.min(999,Math.round(v.newApplications/v.targetNew*100)):0;
    const fillPct=Math.min(100,rate);
    const foreClass = v.forecast>=v.targetNew ? "up":"down";
    return `<tr>
      <td class="l office">${o.office} <span class="pref">${(o.prefectures||[]).join("・")}</span></td>
      <td>${num(v.newApplications)}</td>
      <td>${num(v.reApplications)}</td>
      <td>${num(v.targetNew)}</td>
      <td><div class="bar"><span class="pct">${rate}%</span><span class="track"><span class="fill" style="width:${fillPct}%;${rate>=100?'background:var(--green)':''}"></span></span></div></td>
      <td><span class="pill ${foreClass}">${num(v.forecast)}</span></td>
      <td>${num(v.contacts)}</td>
    </tr>`;
  }).join("");
  const o=DATA.offices;
  return panel("① 応募サマリー","新規・再応募・目標・着地見込み・接触数",
   `<table>
      <thead><tr>
        <th class="l">オフィス</th><th>新規応募</th><th>再応募</th><th>目標(新規)</th><th>達成率</th><th>着地見込み</th><th>接触数</th>
      </tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr>
        <td class="l">合計</td>
        <td>${num(sum(o,"overview.newApplications"))}</td>
        <td>${num(sum(o,"overview.reApplications"))}</td>
        <td>${num(sum(o,"overview.targetNew"))}</td>
        <td></td>
        <td>${num(sum(o,"overview.forecast"))}</td>
        <td>${num(sum(o,"overview.contacts"))}</td>
      </tr></tfoot>
    </table>`);
}

/* ---- Table 2: 人選判定 ---- */
function tableSelection(){
  const keys=[["A","A人選"],["B","B人選"],["C","C人選"],["other","その他"],["unknown","不明"]];
  const rows=DATA.offices.map(o=>{
    const s=o.selection, total=keys.reduce((a,[k])=>a+(s[k]||0),0);
    return `<tr><td class="l office">${o.office}</td>${keys.map(([k])=>`<td>${num(s[k])}</td>`).join("")}<td><strong>${num(total)}</strong></td></tr>`;
  }).join("");
  const o=DATA.offices;
  const foot=keys.map(([k])=>`<td>${num(sum(o,"selection."+k))}</td>`).join("");
  const grand=keys.reduce((a,[k])=>a+sum(o,"selection."+k),0);
  return panel("② 人選判定","A / B / C / その他 / 不明 の人数",
   `<table>
      <thead><tr><th class="l">オフィス</th>${keys.map(([,l])=>`<th>${l}</th>`).join("")}<th>計</th></tr></thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td class="l">合計</td>${foot}<td>${num(grand)}</td></tr></tfoot>
    </table>`);
}

/* ---- Table 3: 歩留 ---- */
function tableFunnel(){
  const groups=[["currentMonthNew","当月内応募・新規"],["within2MonthsNew","2ヶ月以内応募・新規"],["reApplication","再応募"]];
  const stats=[["set","設定"],["done","実施"],["decided","決定"],["started","開始"]];
  const rows=DATA.offices.map(o=>{
    return `<tr><td class="l office">${o.office}</td>`+
      groups.map(([g],gi)=>stats.map(([s],si)=>`<td class="${si===0&&gi>0?'sep':''}">${num(o.funnel[g][s])}</td>`).join("")).join("")+
      `</tr>`;
  }).join("");
  const o=DATA.offices;
  const foot=groups.map(([g],gi)=>stats.map(([s],si)=>`<td class="${si===0&&gi>0?'sep':''}">${num(sum(o,"funnel."+g+"."+s))}</td>`).join("")).join("");
  return panel("③ 歩留（設定→実施→決定→開始）","応募区分ごとの進捗",
   `<div class="legend">
      <span><span class="dot" style="background:var(--coral)"></span>設定＝アポ設定</span>
      <span>実施＝面談実施</span><span>決定＝内定/決定</span><span>開始＝就業開始</span>
    </div>
    <table>
      <thead>
        <tr class="group-head"><th class="l" rowspan="2">オフィス</th>${groups.map(([,l])=>`<th colspan="4">${l}</th>`).join("")}</tr>
        <tr>${groups.map((_,gi)=>stats.map(([,l],si)=>`<th class="${si===0&&gi>0?'sep':''}">${l}</th>`).join("")).join("")}</tr>
      </thead>
      <tbody>${rows}</tbody>
      <tfoot><tr><td class="l">合計</td>${foot}</tr></tfoot>
    </table>`);
}

function panel(title,hint,inner){
  return `<div class="panel"><div class="panel-head"><h2>${title}</h2><span class="hint">${hint}</span></div><div class="scroll">${inner}</div></div>`;
}

function render(){
  renderKpis();
  $("#view").innerHTML = curTab==="overview"?tableOverview():curTab==="selection"?tableSelection():tableFunnel();
  $("#updated").textContent = "集計時刻: "+new Date(DATA.generatedAt).toLocaleString("ja-JP")+"（モックデータ）";
}

document.querySelectorAll(".tab").forEach(t=>t.addEventListener("click",()=>{
  document.querySelectorAll(".tab").forEach(x=>x.classList.remove("active"));
  t.classList.add("active"); curTab=t.dataset.t; render();
}));
$("#refreshBtn").addEventListener("click",()=>{ /* 本番: DATA = await loadFromApi($("#monthSel").value); */ render(); });

render();
</script>
</body>
</html>
